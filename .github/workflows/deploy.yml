name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Next.js App for GitHub Pages
        run: |
          mv src/app/api src/api_temp
          BUILD_TARGET=github-pages npm run build
          mv src/api_temp src/app/api
          touch out/.nojekyll
          cp out/index.html out/404.html
        env:
          NEXT_PUBLIC_BASE_PATH: /meeting-room-booking-system
          NEXT_PUBLIC_CLIENT_MOCK: "true"

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
